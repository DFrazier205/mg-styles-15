<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>BRMG · Backstage Pass — Hanazi kinetic captions (9:16)</title>
<link rel="stylesheet" href="/assets/fonts/fonts.css">
<style>
  html, body { margin: 0; padding: 0; background: #3D3935; overflow: hidden; }
  canvas { display: block; width: 1080px; height: 1920px; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script type="module">
// BRMG "Backstage Pass" — 综艺花字 / Hanazi kinetic captions over stylised candid backstage clips (9:16).
// No camera footage is supplied, so each "clip" is a drawn stand-in with handheld shake, grain, vignette, REC HUD and
// zoom punches. Captions = three-layer sticker type with 8-frame overshoot pops and 2-frame per-character stagger.
// Palette (and nothing else, tints by alpha only): Cover Red #ED2F2F, Parchment #DFD7C7, Charcoal #3D3935.
// Every frame is a pure function of t.
const W = 1080, H = 1920, FPS = 30;
const COL = { RED: '#ED2F2F', PARCH: '#DFD7C7', CH: '#3D3935' };
const rgba = (a) => `rgba(223,215,199,${a})`;            // Parchment tint
const rgbaC = (a) => `rgba(61,57,53,${a})`;               // Charcoal tint
const rgbaR = (a) => `rgba(237,47,47,${a})`;              // Cover Red tint
const C = await (await fetch('/demos/brmg-backstage-hanazi/cues.json')).json();
const STAG = C.stagger, TRANS = C.trans;
const SC = Object.fromEntries(C.scenes.map(s => [s.id, s]));

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, t0, t1) => clamp((t - t0) / (t1 - t0));
const io2 = u => (u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2);
const outC = u => 1 - Math.pow(1 - u, 3);
const rnd = (k) => { const x = Math.sin(k * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

function pop(a) {                      // scale 0 -> 1.15 -> 1.0 in 8 frames
  if (a <= 0) return 0;
  if (a < 5) return 1.15 * outC(a / 5);
  if (a < 8) { const u = (a - 5) / 3; return 1.15 - 0.15 * u * u * (3 - 2 * u); }
  return 1;
}

const cv = document.getElementById('c');
const ctx = cv.getContext('2d', { alpha: false });
ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.miterLimit = 2;
const badge = new Image();
badge.src = '/assets/brands/brmg/logos/BRMG-Logo-minumal-emboss-white.png';

// ------------------------------------------------------------------ sticker type
const FONT = (s) => `${s}px "Bagel Fat One"`;
function glyph(str, st, size) {
  ctx.font = FONT(size); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const total = (st.R1 ? st.R1[1] : 0) + (st.R2 ? 2 * st.R2[1] : 0);
  if (st.S) { ctx.strokeStyle = st.S[0]; ctx.lineWidth = total; ctx.strokeText(str, 0, st.S[1]); ctx.fillStyle = st.S[0]; ctx.fillText(str, 0, st.S[1]); }
  if (st.R2) { ctx.strokeStyle = st.R2[0]; ctx.lineWidth = total; ctx.strokeText(str, 0, 0); }
  if (st.R1) { ctx.strokeStyle = st.R1[0]; ctx.lineWidth = st.R1[1]; ctx.strokeText(str, 0, 0); }
  ctx.fillStyle = st.F; ctx.fillText(str, 0, 0);
}
const scaleSt = (st, f) => ({ F: st.F, R1: st.R1 && [st.R1[0], st.R1[1] * f], R2: st.R2 && [st.R2[0], st.R2[1] * f], S: st.S && [st.S[0], st.S[1] * f] });
function charLine(str, cx, cy, size, st0, t, t0, o = {}) {
  const st = scaleSt(st0, clamp(size / 150, 0.45, 1));
  ctx.font = FONT(size);
  const adv = [...str].map(ch => ctx.measureText(ch).width + (o.track || 0));
  const total = adv.reduce((a, b) => a + b, 0);
  let x = cx - total / 2;
  [...str].forEach((ch, k) => {
    const age = (t - t0 - k * STAG) * FPS;
    const px = x + adv[k] / 2; x += adv[k];
    if (ch === ' ' || age <= 0) return;
    const s = pop(age), settle = clamp((age - 8) / 14);
    const rot = (rnd(k + (o.seed || 0)) - 0.5) * 0.16 * (1 - 0.6 * settle) + 0.03 * Math.sin(t * 7 + k * 0.9) * settle;
    const dy = 5 * Math.sin(t * 6 + k * 0.8) * settle;
    ctx.save(); ctx.translate(px, cy + dy); ctx.rotate(rot); ctx.scale(s, s);
    glyph(ch, st, size); ctx.restore();
  });
}
function fitSize(str, max, wmax) { ctx.font = FONT(100); return Math.min(max, 100 * wmax / ctx.measureText(str).width); }
const sty = (F, r1, r2, s) => ({ F, R1: r1, R2: r2, S: s });
const LA = sty(COL.PARCH, [COL.CH, 22], [COL.RED, 9], [COL.CH, 14]);      // parchment fill, red flower edge
const LB = sty(COL.RED, [COL.PARCH, 22], [COL.CH, 9], [COL.CH, 14]);      // red fill, parchment ring

// ------------------------------------------------------------------ decorations
function burst(cx, cy, R, fill, edge, t, t0, seed = 0) {
  const a = (t - t0) * FPS; if (a <= 0) return;
  const s = pop(a) * (1 + 0.012 * Math.sin(t * 9));
  const n = 16; ctx.save(); ctx.translate(cx, cy); ctx.rotate(0.12 * t + seed); ctx.scale(s, s);
  ctx.beginPath();
  for (let i = 0; i < n * 2; i++) {
    const r = (i % 2 === 0 ? R : R * 0.76) * (0.94 + 0.1 * rnd(i + seed * 7));
    const ang = (i / (n * 2)) * Math.PI * 2;
    i ? ctx.lineTo(Math.cos(ang) * r, Math.sin(ang) * r) : ctx.moveTo(Math.cos(ang) * r, Math.sin(ang) * r);
  }
  ctx.closePath(); ctx.fillStyle = fill; ctx.fill(); ctx.strokeStyle = edge; ctx.lineWidth = 12; ctx.stroke(); ctx.restore();
}
function speedLines(cx, cy, col, t, t0) {
  const a = (t - t0) * FPS; if (a < 0 || a >= 7) return;
  const n = 30, hw = 0.055 * (1 - a / 7), len = 1500 * (0.55 + 0.45 * outC(a / 3));
  ctx.fillStyle = col;
  for (let i = 0; i < n; i++) {
    const ang = (i / n) * Math.PI * 2 + 0.07 * a;
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(ang - hw) * len, cy + Math.sin(ang - hw) * len);
    ctx.lineTo(cx + Math.cos(ang + hw) * len, cy + Math.sin(ang + hw) * len); ctx.closePath(); ctx.fill();
  }
}
function sparkle(cx, cy, r, fill, edge, t, t0) {
  const a = (t - t0) * FPS; if (a <= 0) return;
  const s = pop(a) * (0.86 + 0.18 * Math.sin(t * 8 + cx));
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(0.15 * Math.sin(t * 4 + cy)); ctx.scale(s, s);
  ctx.beginPath();
  for (let i = 0; i < 8; i++) { const ang = i * Math.PI / 4 - Math.PI / 2, rr = i % 2 === 0 ? r : r * 0.28; const x = Math.cos(ang) * rr, y = Math.sin(ang) * rr; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
  ctx.closePath(); ctx.strokeStyle = edge; ctx.lineWidth = 14; ctx.stroke(); ctx.fillStyle = fill; ctx.fill(); ctx.restore();
}
function sticker(fn, cx, cy, size, t, t0, tilt = 0) {
  const a = (t - t0) * FPS; if (a <= 0) return;
  const s = pop(a), settle = clamp((a - 8) / 14);
  ctx.save(); ctx.translate(cx, cy + 6 * Math.sin(t * 5)); ctx.rotate(tilt + 0.07 * Math.sin(t * 6) * settle); ctx.scale(s, s);
  fn(size); ctx.restore();
}
const rr = (x, y, w, h, r) => { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); };
const EDGE = COL.PARCH;      // white-border sticker cut-out look on dark footage

function iconPass(s) {
  const w = s * 0.8, h = s * 1.1, x = -w / 2, y = -h / 2;
  // lanyard strap going off the top
  ctx.strokeStyle = EDGE; ctx.lineWidth = 56; ctx.beginPath(); ctx.moveTo(0, y + 20); ctx.lineTo(0, y - 150); ctx.stroke();
  ctx.strokeStyle = COL.RED; ctx.lineWidth = 30; ctx.beginPath(); ctx.moveTo(0, y + 20); ctx.lineTo(0, y - 150); ctx.stroke();
  rr(x, y, w, h, 26); ctx.strokeStyle = EDGE; ctx.lineWidth = 34; ctx.stroke(); ctx.fillStyle = COL.PARCH; ctx.fill();
  rr(x, y, w, h, 26); ctx.strokeStyle = COL.CH; ctx.lineWidth = 12; ctx.stroke();
  ctx.fillStyle = COL.CH; rr(-w * 0.14, y + 18, w * 0.28, 14, 7); ctx.fill();            // slot
  ctx.save(); rr(x, y, w, h, 26); ctx.clip(); ctx.fillStyle = COL.RED; ctx.fillRect(x, y + h * 0.58, w, h * 0.22); ctx.restore();
  ctx.fillStyle = COL.CH; ctx.beginPath();
  for (let i = 0; i < 10; i++) { const ang = i * Math.PI / 5 - Math.PI / 2, r = i % 2 ? 24 : 58; const px = Math.cos(ang) * r, py = y + h * 0.37 + Math.sin(ang) * r; i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }
  ctx.closePath(); ctx.fill();
  ctx.font = '800 20px "Montserrat"'; ctx.letterSpacing = '2px'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = COL.PARCH; ctx.fillText('ALL ACCESS', 1, y + h * 0.69); ctx.fillStyle = COL.CH; ctx.fillText('BRMG', 2, y + h * 0.9); ctx.letterSpacing = '0px';
}
function iconPhones(s) {
  const r = s * 0.42;
  ctx.lineCap = 'round';
  ctx.strokeStyle = EDGE; ctx.lineWidth = 92; ctx.beginPath(); ctx.arc(0, 0, r, Math.PI * 1.08, Math.PI * 1.92); ctx.stroke();
  ctx.strokeStyle = COL.CH; ctx.lineWidth = 40; ctx.beginPath(); ctx.arc(0, 0, r, Math.PI * 1.08, Math.PI * 1.92); ctx.stroke();
  for (const sx of [-1, 1]) {
    ctx.save(); ctx.translate(sx * r * 0.97, r * 0.2);
    rr(-44, -70, 88, 140, 36); ctx.strokeStyle = EDGE; ctx.lineWidth = 34; ctx.stroke(); ctx.fillStyle = COL.RED; ctx.fill();
    rr(-44, -70, 88, 140, 36); ctx.strokeStyle = COL.CH; ctx.lineWidth = 12; ctx.stroke();
    ctx.strokeStyle = COL.PARCH; ctx.lineWidth = 8; ctx.beginPath(); ctx.moveTo(-18, -34); ctx.lineTo(-18, 34); ctx.stroke();
    ctx.restore();
  }
}
function iconLive(s) {
  const w = s * 1.1, h = s * 0.52, x = -w / 2, y = -h / 2;
  rr(x, y, w, h, h / 2); ctx.strokeStyle = EDGE; ctx.lineWidth = 34; ctx.stroke(); ctx.fillStyle = COL.RED; ctx.fill();
  rr(x, y, w, h, h / 2); ctx.strokeStyle = COL.CH; ctx.lineWidth = 12; ctx.stroke();
  ctx.fillStyle = COL.PARCH; ctx.beginPath(); ctx.arc(x + h * 0.52, 0, h * 0.17, 0, 7); ctx.fill();
  ctx.font = FONT(h * 0.62); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = 12; ctx.strokeStyle = COL.CH; ctx.strokeText('LIVE', h * 0.3, 3); ctx.fillStyle = COL.PARCH; ctx.fillText('LIVE', h * 0.3, 3);
}
function iconCheck(s) {
  const r = s * 0.48;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.strokeStyle = EDGE; ctx.lineWidth = 34; ctx.stroke(); ctx.fillStyle = COL.RED; ctx.fill();
  ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.strokeStyle = COL.CH; ctx.lineWidth = 12; ctx.stroke();
  ctx.strokeStyle = COL.PARCH; ctx.lineWidth = 36; ctx.beginPath(); ctx.moveTo(-r * 0.46, 2); ctx.lineTo(-r * 0.1, r * 0.36); ctx.lineTo(r * 0.5, -r * 0.34); ctx.stroke();
}
function heartPath(s) {
  ctx.beginPath(); ctx.moveTo(0, s * 0.42);
  ctx.bezierCurveTo(-s * 0.62, s * 0.02, -s * 0.5, -s * 0.5, 0, -s * 0.22);
  ctx.bezierCurveTo(s * 0.5, -s * 0.5, s * 0.62, s * 0.02, 0, s * 0.42); ctx.closePath();
}
function drawHeart(cx, cy, s, t, t0, k) {
  const a = (t - t0) * FPS; if (a <= 0) return;
  const life = t - t0; if (life > 1.5) return;
  const sc = pop(a), rise = outC(clamp(life / 1.5)) * 520, sway = Math.sin(life * 5 + k) * 26;
  ctx.save(); ctx.globalAlpha = clamp((1.5 - life) / 0.4); ctx.translate(cx + sway, cy - rise); ctx.rotate(Math.sin(life * 4 + k) * 0.18); ctx.scale(sc, sc);
  heartPath(s); ctx.strokeStyle = COL.PARCH; ctx.lineWidth = 30; ctx.stroke(); ctx.fillStyle = COL.RED; ctx.fill();
  heartPath(s); ctx.strokeStyle = COL.CH; ctx.lineWidth = 10; ctx.stroke();
  ctx.restore();
}

// handwritten arrow (draw-on) + note
function arrow(p0, p1, p2, t, t0, dur = 0.4) {
  const u = prog(t, t0, t0 + dur); if (u <= 0) return;
  const pt = (v) => [(1 - v) * (1 - v) * p0[0] + 2 * (1 - v) * v * p1[0] + v * v * p2[0], (1 - v) * (1 - v) * p0[1] + 2 * (1 - v) * v * p1[1] + v * v * p2[1]];
  const path = () => { ctx.beginPath(); const n = 28; for (let i = 0; i <= n; i++) { const v = (i / n) * u; const [x, y] = pt(v); const w = 3 * Math.sin(i * 1.7 + 1); i ? ctx.lineTo(x + w, y + w * 0.6) : ctx.moveTo(x, y); } };
  const head = () => {
    const [ex, ey] = pt(u), [bx, by] = pt(Math.max(0, u - 0.04)); const ang = Math.atan2(ey - by, ex - bx);
    ctx.beginPath(); ctx.moveTo(ex + Math.cos(ang + 2.55) * 60, ey + Math.sin(ang + 2.55) * 60); ctx.lineTo(ex, ey); ctx.lineTo(ex + Math.cos(ang - 2.55) * 60, ey + Math.sin(ang - 2.55) * 60);
  };
  ctx.strokeStyle = COL.CH; ctx.lineWidth = 30; path(); ctx.stroke(); if (u > 0.9) { head(); ctx.stroke(); }
  ctx.strokeStyle = COL.PARCH; ctx.lineWidth = 13; path(); ctx.stroke(); if (u > 0.9) { head(); ctx.stroke(); }
}
function note(str, x, y, rot, t, t0, size = 58) {
  const a = (t - t0) * FPS; if (a <= 0) return;
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot + 0.02 * Math.sin(t * 5)); const s = pop(a); ctx.scale(s, s);
  glyph(str, sty(COL.PARCH, [COL.CH, 14], null, [COL.RED, 8]), size); ctx.restore();
}

// ------------------------------------------------------------------ footage stand-ins
const persp = (X, Y, z, vx = 540, vy = 840, K = 520) => [vx + X * K / z, vy + Y * K / z];
function quad(pts, fill, stroke, lw) {
  ctx.beginPath(); pts.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y))); ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 4; ctx.stroke(); }
}
function caseBox(x0, x1, y0, y1, z0, z1, side) {      // flight case in corridor space; side = 'L' (inner face is +X) or 'R'
  const F = [persp(x0, y0, z0), persp(x1, y0, z0), persp(x1, y1, z0), persp(x0, y1, z0)];
  const inner = side === 'L'
    ? [persp(x1, y0, z0), persp(x1, y0, z1), persp(x1, y1, z1), persp(x1, y1, z0)]
    : [persp(x0, y0, z0), persp(x0, y0, z1), persp(x0, y1, z1), persp(x0, y1, z0)];
  const top = [persp(x0, y0, z0), persp(x1, y0, z0), persp(x1, y0, z1), persp(x0, y0, z1)];
  if (y0 > 0) quad(top, rgba(0.30), rgba(0.9), 4);
  quad(inner, rgba(0.10), rgba(0.9), 4);
  quad(F, rgba(0.20), rgba(0.95), 5);
  const [ax, ay] = F[0], [bx, by] = F[2], w = bx - ax, h = by - ay;
  ctx.strokeStyle = rgba(0.7); ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(ax, ay + h * 0.28); ctx.lineTo(bx, ay + h * 0.28); ctx.moveTo(ax, ay + h * 0.72); ctx.lineTo(bx, ay + h * 0.72); ctx.stroke();
  ctx.fillStyle = rgba(0.95);
  for (const [fx, fy] of [[0.1, 0.1], [0.9, 0.1], [0.1, 0.9], [0.9, 0.9]]) ctx.fillRect(ax + w * fx - 9, ay + h * fy - 9, 18, 18);
  ctx.fillStyle = COL.RED; ctx.fillRect(ax + w * 0.5 - w * 0.06, ay + h * 0.46, w * 0.12, h * 0.1);   // a red gaff-tape label
}
function person(fx, fy, h, t, o = {}) {              // backlit silhouette: charcoal body + parchment rim; (fx, fy) = feet
  const hr = h * 0.075, hy = fy - h + hr, sh = h * 0.2, sw = h * 0.15;
  const step = Math.sin(t * Math.PI * 4 * (o.walk ?? 1)) * (o.walk === 0 ? 0 : 1);
  ctx.lineCap = 'round';
  const body = () => {
    ctx.beginPath(); ctx.arc(fx, hy, hr, 0, 7);
    ctx.moveTo(fx - sw, fy - h * 0.43); ctx.lineTo(fx - sw * 0.9, fy - h * 0.82); ctx.quadraticCurveTo(fx, fy - h * 0.9, fx + sw * 0.9, fy - h * 0.82);
    ctx.lineTo(fx + sw, fy - h * 0.43); ctx.closePath();
  };
  const limbs = () => {
    ctx.beginPath();
    ctx.moveTo(fx - sw * 0.5, fy - h * 0.43); ctx.lineTo(fx - sw * 0.5 + step * h * 0.07, fy);
    ctx.moveTo(fx + sw * 0.5, fy - h * 0.43); ctx.lineTo(fx + sw * 0.5 - step * h * 0.07, fy);
    ctx.moveTo(fx - sw * 0.95, fy - h * 0.8); ctx.lineTo(fx - sw * 1.2 - step * h * 0.05, fy - h * 0.5);
    ctx.moveTo(fx + sw * 0.95, fy - h * 0.8); ctx.lineTo(fx + sw * 1.2 + step * h * 0.05, fy - h * 0.5);
  };
  ctx.strokeStyle = rgba(0.9); ctx.lineWidth = h * 0.08 + 8; limbs(); ctx.stroke(); body(); ctx.lineWidth = 8; ctx.stroke();
  ctx.strokeStyle = COL.CH; ctx.lineWidth = h * 0.08; limbs(); ctx.stroke();
  ctx.fillStyle = COL.CH; body(); ctx.fill();
}

function sceneCorridor(t, lt) {
  ctx.fillStyle = COL.CH; ctx.fillRect(-100, -100, W + 200, H + 200);
  const g = ctx.createRadialGradient(540, 830, 0, 540, 830, 820);
  g.addColorStop(0, rgba(0.95)); g.addColorStop(0.18, rgba(0.55)); g.addColorStop(1, rgba(0)); ctx.fillStyle = g; ctx.fillRect(-100, -100, W + 200, H + 200);
  const zN = 0.5, zF = 2.2;
  quad([persp(-1, -1.5, zN), persp(-1, 1, zN), persp(-1, 1, zF), persp(-1, -1.5, zF)], rgbaC(0.92));           // left wall
  quad([persp(1, -1.5, zN), persp(1, 1, zN), persp(1, 1, zF), persp(1, -1.5, zF)], rgbaC(0.92));              // right wall
  quad([persp(-1, 1, zN), persp(1, 1, zN), persp(1, 1, zF), persp(-1, 1, zF)], rgba(0.16));                    // floor
  quad([persp(-1, -1.5, zN), persp(1, -1.5, zN), persp(1, -1.5, zF), persp(-1, -1.5, zF)], rgbaC(0.95));       // ceiling
  // wall panel seams + floor bands
  ctx.strokeStyle = rgba(0.22); ctx.lineWidth = 3;
  for (let z = 0.7; z < zF; z += 0.34) { for (const X of [-1, 1]) { const a = persp(X, -1.5, z), b = persp(X, 1, z); ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke(); } }
  for (let z = 0.7; z < zF; z += 0.17) { const a = persp(-1, 1, z), b = persp(1, 1, z); ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke(); }
  // red gaff-tape line along the floor
  quad([persp(-0.05, 1, zN), persp(0.05, 1, zN), persp(0.05, 1, zF), persp(-0.05, 1, zF)], rgbaR(0.95));
  // ceiling strip lights (one flickers)
  [0.8, 1.15, 1.5, 1.85].forEach((z, i) => {
    const fl = i === 1 ? (0.55 + 0.45 * (Math.sin(t * 31) > -0.4 ? 1 : 0)) : 1;
    quad([persp(-0.45, -1.5, z), persp(0.45, -1.5, z), persp(0.45, -1.5, z + 0.12), persp(-0.45, -1.5, z + 0.12)], rgba(0.95 * fl));
  });
  // cases
  caseBox(-1, -0.58, 0.18, 1, 0.75, 1.4, 'L');
  caseBox(-1, -0.7, 0.35, 1, 1.55, 2.0, 'L');
  caseBox(0.55, 1, -0.35, 1, 1.0, 1.7, 'R');
  caseBox(0.62, 1, 0.45, 1, 0.62, 0.95, 'R');
  // door at the far end
  const d0 = persp(-0.45, -0.9, zF), d1 = persp(0.45, 1, zF);
  ctx.fillStyle = COL.PARCH; ctx.fillRect(d0[0], d0[1], d1[0] - d0[0], d1[1] - d0[1]);
  ctx.fillStyle = COL.RED; ctx.fillRect(d0[0] - 22, d0[1] - 58, d1[0] - d0[0] + 44, 46);
  ctx.font = '800 28px "Montserrat"'; ctx.letterSpacing = '8px'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = COL.PARCH; ctx.fillText('STAGE', 540 + 4, d0[1] - 35); ctx.letterSpacing = '0px';
  // someone walking to the door
  const u = prog(lt, 0.0, 3.5), z = 1.7 + u * 0.38, X = 0.2 - 0.18 * u, fy = persp(X, 1, z)[1], fx = persp(X, 1, z)[0];
  const hp = 1.6 * 520 / z, bob = Math.abs(Math.sin(t * Math.PI * 4)) * 6 / z;
  person(fx, fy - bob, hp, t, { walk: 1 });
}

function sceneDressing(t, lt) {
  ctx.fillStyle = COL.CH; ctx.fillRect(-100, -100, W + 200, H + 200);
  ctx.fillStyle = rgba(0.07); for (let i = 0; i < 6; i++) ctx.fillRect(i * 190 - 40, 0, 96, 1300);      // wall panels
  // counter
  ctx.fillStyle = rgba(0.16); ctx.fillRect(-60, 1290, W + 120, 700); ctx.fillStyle = rgba(0.7); ctx.fillRect(-60, 1284, W + 120, 10);
  // bottles + products
  [[110, 1180, 70, 105], [210, 1210, 54, 75], [840, 1170, 84, 115], [950, 1200, 58, 85]].forEach(([x, y, w, h], i) => {

  m(F.micro, 1590, F.micro_t, 31, 6);
  m(F.group, 1650, F.group_t, 31, 6);
  const sp = [[110, 1060], [975, 1355], [95, 1345]];
  F.sparkle_t.forEach((st, k) => sparkle(sp[k][0], sp[k][1], k === 0 ? 60 : 46, k % 2 ? COL.CH : COL.RED, k % 2 ? COL.PARCH : COL.CH, t, st));
}

// ------------------------------------------------------------------ compositor
function render(t) {
  const sceneAt = (tt) => C.scenes.find(s => tt >= s.S && tt < s.E) || C.scenes[C.scenes.length - 1];
  ctx.save();
  const hero = C.hero_t, ha = (t - hero) * FPS;
  if (ha >= 0 && ha < 10) ctx.translate(Math.sin(ha * 3.3) * 16 * (1 - ha / 10), Math.cos(ha * 2.7) * 12 * (1 - ha / 10));
  const fS = C.final.S, sc = sceneAt(Math.min(t, fS - 1e-4));
  if (t < fS - TRANS) drawClip(sceneAt(t), t);
  else {
    const p = io2(prog(t, fS - TRANS, fS));
    ctx.save(); ctx.translate(0, -p * H * 0.22); drawClip(C.scenes[3], t); ctx.restore();
    if (p > 0) {
      const off = (1 - p) * (H + 50);
      ctx.save(); ctx.beginPath(); ctx.moveTo(-100, H + 100);
      for (let x = -100; x <= W + 100; x += 10) ctx.lineTo(x, off - 44 * Math.abs(Math.sin(x * Math.PI / 135)));
      ctx.lineTo(W + 100, H + 100); ctx.closePath(); ctx.clip(); drawFinal(t); ctx.restore();
      if (p < 1) {
        ctx.beginPath(); for (let x = -100; x <= W + 100; x += 10) { const y = off - 44 * Math.abs(Math.sin(x * Math.PI / 135)); x === -100 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); }
        ctx.strokeStyle = COL.CH; ctx.lineWidth = 12; ctx.stroke();
      }
    }
  }
  // cut flashes (parchment, 2 frames) on the hard cuts and on the hero hit
  const flash = (t0, a0, fr) => { const d = (t - t0) * FPS; if (d >= 0 && d < fr) { ctx.fillStyle = rgba(a0 * (1 - d / fr)); ctx.fillRect(-60, -60, W + 120, H + 120); } };
  C.cuts.forEach(c => flash(c, 0.8, 2));
  flash(hero, 1.0, 1.2);
  ctx.restore();
}
