<!doctype html>
<html><head><meta charset="utf-8"><title>Go-Go Royalty.com — Vintage Station</title>
<link rel="stylesheet" href="/assets/fonts/fonts.css">
<style>
@font-face { font-family: 'GGRBarlow'; src: url('./fonts/barlow-condensed-latin-500-normal.woff2') format('woff2'); font-weight: 500; font-display: block; }
@font-face { font-family: 'GGRBarlow'; src: url('./fonts/barlow-condensed-latin-600-normal.woff2') format('woff2'); font-weight: 600; font-display: block; }
html,body{margin:0;padding:0;background:#0d0710;overflow:hidden;width:1920px;height:1080px}canvas{display:block}
</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script>
/* Go-Go Royalty.com — "Vintage Station" (prompt 12-1, 80s VHS), mid-1980s DC go-go edition.
   A VHS tape locks in on a dusk avenue of DC row houses (parked cars, streetlights, a records shop, a carry-out) with the Capitol at the end of the
   street and the Washington Monument over the roofs; the camera dollies down the block while a stoop with xeroxed band handbills and a boombox
   and a pair of congas slide in and pulse to the groove (same pattern as audio.py); a chrome VINTAGE STATION title slams in with 1977-2009 in neon,
   a 24-hour clock runs, then the sun slides aside to become the halo of the real Go-Go Royalty seal for the end card. Pure function of t; timing from cues.json.
   Brand: void #0d0710, Vivid Violet #b45cfd (single accent), Royal Purple / Deep Plum surfaces, Playfair Display Black Italic, Barlow Condensed, no greys. */
const W = 1920, H = 1080, HZ = 640, cv = document.getElementById('c'), ctx = cv.getContext('2d', { willReadFrequently: true });
const K = { void:'#0d0710', card:'#1a0d22', elev:'#241030', royal:'#5d306b', plum:'#6c3e7a', vio:'#b45cfd', wh:'#ffffff', blush:'#f4e8fe', muted:'#c4a8d4', lav:'#e9d3fc' };
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const lerp = (a, b, u) => a + (b - a) * u;
const inv = (a, b, x) => clamp((x - a) / (b - a));
const eo = u => 1 - (1 - u) ** 3, eio = u => u < .5 ? 4 * u ** 3 : 1 - (-2 * u + 2) ** 3 / 2;
const eb = (u, s = 1.9) => 1 + (s + 1) * (u - 1) ** 3 + s * (u - 1) ** 2;
const hash = (...a) => { let h = 2166136261; for (const v of a) { h ^= Math.floor(v * 1000) + 0x9e3779b9; h = Math.imul(h, 16777619); } return ((h ^ h >>> 15) >>> 0) / 4294967296; };
const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${n >> 8 & 255},${n & 255},${a})`; };
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
let C = null, ART = null, SEAL = null, TITLE = null, TITLE_SZ = null, SUNCV = null, GLINT = null, SEAL_GLOW = null, FIT = null;
const SC = mk(W, H), sctx = SC.getContext('2d', { willReadFrequently: true });
const SEAL_S = 600 / 944;                 // seal scale so the artwork's visible height is 600 px (source bbox x 99-912, y 47-991)
const SEAL_CX = 505.5, SEAL_CY = 519;

/* ---------- camera travel: speed profile integrated once into a table (still a pure function of t) ---------- */
const TRAVEL = (() => { const n = 2001, a = new Float64Array(n); let d = 0; const v = t => 1.0 + 4.2 * eo(inv(0.4, 3.6, t)) - 2.9 * eo(inv(5.6, 7.0, t));
  for (let i = 1; i < n; i++) { d += v((i - 1) / 200) / 200; a[i] = d; } return t => { const x = clamp(t, 0, 10) * 200, i = Math.min(n - 2, Math.floor(x)); return lerp(a[i], a[i + 1], x - i); }; })();

/* ---------- VHS noise table ---------- */
const NZ = new Uint8Array(1 << 18); { let s = 12345; for (let i = 0; i < NZ.length; i++) { s = (Math.imul(s, 1664525) + 1013904223) >>> 0; NZ[i] = s >>> 24; } }

/* ---------- chrome title (cached once) ---------- */
function buildTitle() {
  const lines = ['VINTAGE', 'STATION'];
  const t = mk(1800, 640), c = t.getContext('2d');
  c.font = 'italic 900 200px "Playfair Display"'; const w0 = Math.max(...lines.map(s => c.measureText(s).width));
  const size = Math.min(210, 200 * 1380 / w0); TITLE_SZ = size;
  c.font = `italic 900 ${size}px "Playfair Display"`; c.textAlign = 'center'; c.textBaseline = 'alphabetic'; c.letterSpacing = '5px';
  const base = [250, 250 + size * 1.04];
  const cap = size * 0.72;
  // neon halo
  c.save(); c.shadowColor = K.vio; c.shadowBlur = 46; c.fillStyle = K.vio; lines.forEach((s, i) => c.fillText(s, 900, base[i])); c.restore();
  // extrusion (deep plum -> elevated), down-right
  for (let e = 14; e >= 1; e--) { c.fillStyle = e > 6 ? K.elev : K.royal; lines.forEach((s, i) => c.fillText(s, 900 + e * 0.9, base[i] + e * 1.1)); }
  // chrome face
  lines.forEach((s, i) => {
    const g = c.createLinearGradient(0, base[i] - cap, 0, base[i] + size * 0.04);
    g.addColorStop(0, '#ffffff'); g.addColorStop(.18, K.blush); g.addColorStop(.44, K.muted); g.addColorStop(.5, K.plum); g.addColorStop(.54, K.royal);
    g.addColorStop(.7, K.vio); g.addColorStop(.88, K.lav); g.addColorStop(1, K.blush);
    c.fillStyle = g; c.fillText(s, 900, base[i]);
    c.lineWidth = 2.4; c.strokeStyle = 'rgba(255,255,255,.75)'; c.strokeText(s, 900, base[i]);
  });
  // bevel highlight: thin offset light edge on top-left
  c.save(); c.globalCompositeOperation = 'source-atop'; c.fillStyle = 'rgba(255,255,255,.0)'; c.restore();
  TITLE = t; return base;
}
let TBASE = null;

/* ---------- sun disc (plain, no stripes: a dusk sun over the avenue) ---------- */
function drawSunLayer(R) {
  const c = SUNCV.getContext('2d'), S = SUNCV.width, cx = S / 2, cy = S / 2;
  c.clearRect(0, 0, S, S);
  const g = c.createLinearGradient(0, cy - R, 0, cy + R);
  g.addColorStop(0, K.blush); g.addColorStop(.3, K.vio); g.addColorStop(.78, K.plum); g.addColorStop(1, K.royal);
  c.fillStyle = g; c.beginPath(); c.arc(cx, cy, R, 0, Math.PI * 2); c.fill();
}
function drawSun(sunX, sunY, R, glowA, clipHz, alpha = 1) {
  const c = sctx;
  c.save(); c.globalCompositeOperation = 'lighter';
  const gl = c.createRadialGradient(sunX, sunY, R * 0.6, sunX, sunY, R * 2.1); gl.addColorStop(0, rgba(K.vio, .34 * glowA * alpha)); gl.addColorStop(.5, rgba(K.plum, .22 * glowA * alpha)); gl.addColorStop(1, rgba(K.plum, 0));
  c.fillStyle = gl; c.fillRect(0, 0, W, clipHz ? HZ + 5 : H); c.restore();
  drawSunLayer(R); c.save(); if (clipHz) { c.beginPath(); c.rect(0, 0, W, HZ); c.clip(); } c.globalAlpha = alpha; c.drawImage(SUNCV, sunX - SUNCV.width / 2, sunY - SUNCV.height / 2); c.restore();
}

/* ---------- the go-go groove (same pattern and kinds as audio.py): drives speakers, drum heads, EQ ---------- */
const PAT = 'x.xx.x..x.xx.x.x', KINDS = ['low', 'open', 'slap', 'open', 'slap', 'low', 'open', 'slap'];
function groove(t) {
  const st = 60 / C.bpm / 4, pre = C.drop - 8 * st; let big = 0, small = 0;
  const ph = (t * C.bpm / 60) % 1, beat = Math.exp(-ph * 6) * 0.3;
  if (t < pre) return { big, small, beat };
  const n = Math.floor((t - C.drop) / st);
  for (let j = n; j > n - 7 && j >= -8; j--) {
    const k = ((j % 16) + 16) % 16, bar = Math.floor(j / 16);
    if (PAT[k] !== 'x') continue;
    const age = t - (C.drop + j * st); if (age < 0) continue;
    const e = Math.exp(-age / 0.085) * (j < 0 ? 0.55 : 1), kind = KINDS[(((bar * 3 + k) % 8) + 8) % 8];
    if (kind === 'low' || kind === 'open') big = Math.max(big, e); else small = Math.max(small, e);
  }
  return { big, small, beat };
}

/* ---------- DC avenue: one-point perspective, row houses, parked cars, sidewalks, streetlights ---------- */
const F = 900, EYE = 1.6, XW = 8, XC = 5.4, LOT = 3.4, ZN = 2.6, ZF = 80;
const P = (X, Y, z) => [960 + X * F / z, HZ + (EYE - Y) * F / z];
const mixc = (a, b, u) => { const A = parseInt(a.slice(1), 16), B = parseInt(b.slice(1), 16), m = s => Math.round(lerp(A >> s & 255, B >> s & 255, u)); return `rgb(${m(16)},${m(8)},${m(0)})`; };
const quad = (c, pts) => { c.beginPath(); c.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) c.lineTo(pts[i][0], pts[i][1]); c.closePath(); };
const fogAt = z => clamp((z - 12) / 64) ** 0.85 * 0.88;
const wquad = (s, ya, yb, za, zb) => [P(s * XW, ya, za), P(s * XW, ya, zb), P(s * XW, yb, zb), P(s * XW, yb, za)];

function planeText(c, txt, s, ya, yb, za, zb, col, fg) {
  const [zA, zB] = s < 0 ? [za, zb] : [zb, za];
  const p0 = P(s * XW, ya, zA), p1 = P(s * XW, ya, zB), pt = P(s * XW, yb, zA);
  c.save(); c.font = '600 100px GGRBarlow'; c.letterSpacing = '8px'; const w = c.measureText(txt).width;
  c.transform((p1[0] - p0[0]) / w, (p1[1] - p0[1]) / w, (p0[0] - pt[0]) / 70, (p0[1] - pt[1]) / 70, p0[0], p0[1]);
  c.textBaseline = 'alphabetic'; c.lineJoin = 'round'; c.globalCompositeOperation = 'lighter';
  c.lineWidth = 26; c.strokeStyle = rgba(col, .16 * (1 - fg)); c.strokeText(txt, 0, 0);
  c.lineWidth = 12; c.strokeStyle = rgba(col, .38 * (1 - fg)); c.strokeText(txt, 0, 0);
  c.fillStyle = mixc(K.blush, K.elev, fg); c.fillText(txt, 0, 0); c.restore();
}

function box(c, s, xi, xo, ya, yb, za, zb, side, top, front) {
  if (yb < EYE) { c.fillStyle = top; quad(c, [P(s * xi, yb, za), P(s * xo, yb, za), P(s * xo, yb, zb), P(s * xi, yb, zb)]); c.fill(); }
  c.fillStyle = side; quad(c, [P(s * xi, ya, za), P(s * xi, ya, zb), P(s * xi, yb, zb), P(s * xi, yb, za)]); c.fill();
  c.fillStyle = front; quad(c, [P(s * xi, ya, za), P(s * xo, ya, za), P(s * xo, yb, za), P(s * xi, yb, za)]); c.fill();
}

function car(c, n, s, D) {
  const r = hash(n, s * 5 + 3, 77); if (r < 0.42) return;
  const z0 = n * LOT - D + 0.25 + 0.3 * hash(n, s, 78), z1 = z0 + 3.0; if (z0 < 1.6 || z0 > ZF) return;
  const fg = fogAt(z0), pal = [K.royal, K.plum, K.elev, K.card], base = pal[Math.floor(r * 40) % 4];
  const body = mixc(mixc(base, K.void, .55), K.elev, fg), top = mixc(mixc(base, K.void, .3), K.elev, fg), fr = mixc(K.void, K.elev, fg);
  box(c, s, 3.1, 5.1, 0.28, 0.98, z0, z1, body, top, fr);
  box(c, s, 3.5, 4.8, 0.98, 1.5, z0 + 0.5, z1 - 0.55, mixc(K.void, K.card, .4 + .5 * fg), top, fr);
  // lights on the near end
  c.fillStyle = mixc(K.vio, K.elev, fg); for (const x of [3.3, 4.9]) { quad(c, [P(s * (x - 0.2), .55, z0), P(s * (x + 0.2), .55, z0), P(s * (x + 0.2), .75, z0), P(s * (x - 0.2), .75, z0)]); c.fill(); }
  c.strokeStyle = rgba(K.vio, .45 * (1 - fg)); c.lineWidth = 1.6; c.beginPath(); const a = P(s * 3.1, .98, z0), b = P(s * 3.1, .98, z1); c.moveTo(a[0], a[1]); c.lineTo(b[0], b[1]); c.stroke();
}

function house(c, n, s, D, t) {
  const z0 = n * LOT - D, z1 = z0 + LOT; if (z1 < 1.0 || z0 > ZF) return;
  const za = Math.max(z0, 0.9), r1 = hash(n, s * 3 + 1), r2 = hash(n, s * 3 + 2), fg = fogAt(z0), hz = K.elev;
  const Hh = 8.6 + 2.8 * r1, base = mixc(K.void, K.royal, 0.3 + 0.42 * r2), Zu = u => Math.max(z0 + u * LOT, 0.9);
  c.fillStyle = mixc(base, hz, fg); quad(c, wquad(s, 0, Hh, za, z1)); c.fill();
  // brick courses
  c.strokeStyle = rgba(K.void, .22 * (1 - fg)); c.lineWidth = 1; c.beginPath();
  for (let y = 0.6; y < Hh; y += 0.6) { const a = P(s * XW, y, za), b = P(s * XW, y, z1); c.moveTo(a[0], a[1]); c.lineTo(b[0], b[1]); } c.stroke();
  // cornice + roof rim
  c.fillStyle = mixc(K.plum, hz, fg + .1); quad(c, wquad(s, Hh - 0.55, Hh, za, z1)); c.fill();
  c.strokeStyle = rgba(K.vio, .5 * (1 - fg)); c.lineWidth = 2; c.beginPath(); { const a = P(s * XW, Hh, za), b = P(s * XW, Hh, z1); c.moveTo(a[0], a[1]); c.lineTo(b[0], b[1]); } c.stroke();
  const win = (ua, ub, ya, yb, key) => {
    const r = hash(n, s, key); let col;
    if (r > .46) { const f = r > .94 ? (Math.floor(t * 10 + r * 9) % 2 ? K.vio : K.muted) : (r > .8 ? mixc(K.lav, K.vio, .35) : mixc(K.vio, K.plum, .45)); col = mixc(f, hz, fg * .85); }
    else col = mixc(K.void, K.card, .5 + .5 * fg);
    c.fillStyle = col; quad(c, [P(s * XW, ya, Zu(ua)), P(s * XW, ya, Zu(ub)), P(s * XW, yb, Zu(ub)), P(s * XW, yb, Zu(ua))]); c.fill();
    c.strokeStyle = rgba(K.plum, .6 * (1 - fg)); c.lineWidth = 1.3; c.stroke();
  };
  const floors = Hh > 10.2 ? [[2.9, 4.6], [5.7, 7.4], [8.3, 9.8]] : [[2.9, 4.6], [5.9, 7.6]];
  floors.forEach(([ya, yb], i) => { win(.12, .38, ya, yb, 10 + i * 2); win(.62, .88, ya, yb, 11 + i * 2); });
  // ground floor: door + window
  c.fillStyle = mixc(K.void, K.card, .35 + .4 * fg); quad(c, [P(s * XW, 0, Zu(.08)), P(s * XW, 0, Zu(.32)), P(s * XW, 2.5, Zu(.32)), P(s * XW, 2.5, Zu(.08))]); c.fill();
  c.strokeStyle = rgba(K.vio, .35 * (1 - fg)); c.lineWidth = 1.4; c.stroke();
  win(.58, .9, 0.8, 2.2, 30);
  // stoop steps
  c.strokeStyle = rgba(K.lav, .25 * (1 - fg)); c.lineWidth = 1.6; c.beginPath();
  for (let k = 0; k < 3; k++) { const a = P(s * (XW - 0.25 - k * 0.4), 0.2 + k * -0.0, Zu(.04)), b = P(s * (XW - 0.25 - k * 0.4), 0.2, Zu(.36)); c.moveTo(a[0], a[1] + k * 2); c.lineTo(b[0], b[1] + k * 2); } c.stroke();
  // shop signs
  if (s < 0 && ((n % 8) + 8) % 8 === 2) { sign(c, 'RECORDS', s, za, z1, fg, Zu); }
  if (s > 0 && ((n % 9) + 9) % 9 === 4) { sign(c, 'CARRY OUT', s, za, z1, fg, Zu); }
}
function sign(c, txt, s, za, z1, fg, Zu) {
  const ya = 5.6, yb = 6.9, a = Zu(.06), b = Zu(.94);
  c.fillStyle = mixc(K.void, K.card, .3 + fg * .6); quad(c, wquad(s, ya - .25, yb + .25, a, b)); c.fill();
  c.strokeStyle = rgba(K.vio, .8 * (1 - fg)); c.lineWidth = 2; c.stroke();
  planeText(c, txt, s, ya, yb, a + .15, b - .15, K.vio, fg);
}

function lamp(c, z, s) {
  if (z < 7 || z > ZF) return;
  const fg = fogAt(z), foot = P(s * 5.9, 0, z), top = P(s * 5.9, 7.4, z), lp = P(s * 4.5, 7.2, z), wd = Math.max(1.2, 0.2 * F / z);
  c.strokeStyle = mixc(K.royal, K.elev, fg); c.lineWidth = wd; c.lineCap = 'round'; c.beginPath(); c.moveTo(foot[0], foot[1]); c.lineTo(top[0], top[1]); c.lineTo(lp[0], lp[1] - wd * .2); c.stroke();
  c.save(); c.globalCompositeOperation = 'lighter';
  const r = Math.max(12, 3.6 * F / z), g = c.createRadialGradient(lp[0], lp[1], 0, lp[0], lp[1], r);
  g.addColorStop(0, rgba(K.blush, .85 * (1 - fg * .5))); g.addColorStop(.12, rgba(K.vio, .5 * (1 - fg * .5))); g.addColorStop(1, rgba(K.vio, 0)); c.fillStyle = g; c.fillRect(lp[0] - r, lp[1] - r, 2 * r, 2 * r);
  const gp = P(s * 4.5, 0, z), rx = 3.4 * F / z; c.translate(gp[0], gp[1]); c.scale(1, .18); const g2 = c.createRadialGradient(0, 0, 0, 0, 0, rx); g2.addColorStop(0, rgba(K.vio, .32 * (1 - fg))); g2.addColorStop(1, rgba(K.vio, 0)); c.fillStyle = g2; c.fillRect(-rx, -rx, 2 * rx, 2 * rx);
  c.restore();
}

function avenue(t, D) {
  const c = sctx;
  const g = c.createLinearGradient(0, HZ, 0, H); g.addColorStop(0, K.elev); g.addColorStop(.25, K.card); g.addColorStop(1, K.void);
  c.fillStyle = g; c.fillRect(0, HZ, W, H - HZ);
  for (const s of [-1, 1]) { c.fillStyle = rgba(K.royal, .55); quad(c, [P(s * XC, 0, ZN * .5), P(s * XC, 0, 500), P(s * XW, 0, 500), P(s * XW, 0, ZN * .5)]); c.fill(); }
  c.strokeStyle = rgba(K.vio, .5); c.lineWidth = 2; c.beginPath();
  for (const s of [-1, 1]) { const a = P(s * XC, 0, ZN * .5), b = P(s * XC, 0, 500); c.moveTo(a[0], a[1]); c.lineTo(b[0], b[1]); } c.stroke();
  // sidewalk joints and road dashes move with the camera (the speed cue)
  c.strokeStyle = rgba(K.void, .55); c.lineWidth = 1.5; c.beginPath();
  for (let k = 0; k < 50; k++) { const z = (k * 2 - (D % 2)) + 0; if (z < ZN * .6) continue; for (const s of [-1, 1]) { const a = P(s * XC, 0, z), b = P(s * XW, 0, z); c.moveTo(a[0], a[1]); c.lineTo(b[0], b[1]); } } c.stroke();
  for (let k = 0; k < 24; k++) { const za = k * 6 - (D % 6), zb = za + 2.6; if (zb < ZN * .6) continue; const fg = fogAt(za);
    c.fillStyle = rgba(K.blush, .8 * (1 - fg)); quad(c, [P(-0.1, 0, Math.max(za, .9)), P(0.1, 0, Math.max(za, .9)), P(0.1, 0, zb), P(-0.1, 0, zb)]); c.fill(); }
  const hzf = c.createLinearGradient(0, HZ, 0, HZ + 160); hzf.addColorStop(0, rgba(K.elev, .95)); hzf.addColorStop(1, rgba(K.elev, 0)); c.fillStyle = hzf; c.fillRect(0, HZ, W, 160);
  const nS = Math.floor(D / LOT), nE = nS + Math.ceil(ZF / LOT) + 1;
  for (let n = nE; n >= nS - 1; n--) for (const s of [-1, 1]) { house(c, n, s, D, t); car(c, n, s, D); }
  for (let k = Math.floor(D / 11) + 8; k >= Math.floor(D / 11) - 1; k--) { lamp(c, k * 11 - D, -1); lamp(c, k * 11 + 5.5 - D, 1); }
}

function landmarks() {
  const c = sctx, rim = () => { c.strokeStyle = rgba(K.vio, .5); c.lineWidth = 1.6; c.stroke(); };
  c.save(); c.fillStyle = mixc(K.void, K.elev, .45);
  // Capitol at the end of the avenue
  { const x = 960, y = HZ + 4, k = 0.5; c.save(); c.translate(x, y); c.scale(k, k);
    c.beginPath(); c.rect(-190, -56, 380, 56); c.fill(); rim(); c.beginPath(); c.rect(-90, -90, 180, 36); c.fill(); rim(); c.beginPath(); c.rect(-52, -142, 104, 54); c.fill(); rim();
    c.beginPath(); c.ellipse(0, -142, 56, 74, 0, Math.PI, 0); c.fill(); rim(); c.beginPath(); c.rect(-11, -238, 22, 24); c.fill(); rim();
    c.beginPath(); c.moveTo(-7, -238); c.lineTo(0, -262); c.lineTo(7, -238); c.closePath(); c.fill(); rim(); c.restore(); }
  // Washington Monument above the roofline
  { const x = 1262, y = HZ, k = 1.12; c.beginPath(); c.moveTo(x - 22 * k, y); c.lineTo(x - 13 * k, y - 330 * k); c.lineTo(x, y - 372 * k); c.lineTo(x + 13 * k, y - 330 * k); c.lineTo(x + 22 * k, y); c.closePath(); c.fill(); rim();
    c.save(); c.shadowColor = K.vio; c.shadowBlur = 12; c.fillStyle = K.vio; c.beginPath(); c.arc(x, y - 378 * k, 3.5, 0, 7); c.fill(); c.restore(); }
  c.restore();
}

/* ---------- foreground: the stoop (wall, handbills, boombox) and the congas ---------- */
function duo(img, w, h) { const cv_ = mk(w, h), g = cv_.getContext('2d'); const ar = img.width / img.height, ca = w / h; let sw = img.width, sh = img.height, sx = 0, sy = 0;
  if (ar > ca) { sw = img.height * ca; sx = (img.width - sw) / 2; } else { sh = img.width / ca; sy = (img.height - sh) / 2; }
  g.filter = 'grayscale(1) contrast(1.25)'; g.drawImage(img, sx, sy, sw, sh, 0, 0, w, h); g.filter = 'none';
  g.globalCompositeOperation = 'multiply'; g.fillStyle = K.lav; g.fillRect(0, 0, w, h);
  g.globalCompositeOperation = 'screen'; g.fillStyle = rgba(K.royal, .45); g.fillRect(0, 0, w, h); return cv_; }
